<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<title>Velora</title>
<style>
  :root{
    /* ── Velora 浅色体系：所有色相都来自这块屏幕本身 ── */
    --bg:#f2f2f7;            /* 屏幕底 */
    --page:#eef0f4;          /* 页面底（冷中性） */
    --surface:#ffffff;       /* 胶囊 / 卡片 */
    --surface2:#f2f2f7;
    --surface3:#e5e5ea;
    --ink:#101216;           /* 主文字（暖黑） */
    --muted:#6e6e73;
    --dim:#aeaeb2;
    --line:rgba(16,18,22,.09);
    --line2:rgba(16,18,22,.16);
    --track:#d1d1d8;         /* 仪表轨道 */
    --blue:#007aff;          /* 主导：定位 / 路线 / 正常仪表 */
    --blue-deep:#0060df;
    --cyan:#32ade6;          /* 仪表渐变副色 / 信息 */
    --red:#ff3b30;           /* 限速牌 / 超速 / 红灯 */
    --amber:#ff9500;         /* 黄灯 / 警示 */
    --green:#34c759;         /* 绿灯 / 通行 / 在线 */
    --blue-soft:rgba(0,122,255,.10);
    --red-soft:rgba(255,59,48,.16);
    --green-soft:rgba(52,199,89,.12);
    --ease:cubic-bezier(.22,1,.36,1);   /* SlmEase，与 Compose 一致 */
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{min-width:320px;background:var(--page);scrollbar-width:thin;scrollbar-color:#c2c8d2 transparent;}
  body{
    margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);
    background:
      radial-gradient(1100px 620px at 82% -14%,rgba(0,122,255,.075),transparent 56%),
      radial-gradient(900px 640px at -8% 108%,rgba(50,173,230,.07),transparent 52%),
      radial-gradient(700px 500px at 50% 50%,rgba(255,255,255,.5),transparent 70%),
      var(--page);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* 页面环境光：极克制的漂移光晕 */
  body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:0;pointer-events:none;
    background:radial-gradient(560px 380px at 28% 22%,rgba(0,122,255,.06),transparent 70%);
    filter:blur(10px);animation:drift 26s ease-in-out infinite alternate;}
  @keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1);}to{transform:translate3d(5%,3%,0) scale(1.1);}}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#c2c8d2;border-radius:99px;border:2px solid var(--page);}
  ::-webkit-scrollbar-thumb:hover{background:var(--blue);}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer;}
  button:focus-visible{outline:3px solid rgba(0,122,255,.28);outline-offset:3px;}
  svg{display:block;}
  .tabular{font-variant-numeric:tabular-nums lining-nums;}

  .page{position:relative;z-index:1;width:min(100%,1560px);height:100svh;min-height:680px;margin:0 auto;
    padding:18px 24px;display:flex;flex-direction:column;overflow:hidden;}

  /* ── 顶部：品牌 / 4 段剧本 / 播放控制 ── */
  .topbar{flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand steps ctl";
    align-items:center;gap:28px;margin-bottom:20px;animation:rise .7s var(--ease) both;}
  .brand{grid-area:brand;display:flex;align-items:center;gap:12px;flex:0 0 auto;}
  .brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,#2b9bff,#0060df);
    box-shadow:0 9px 24px rgba(0,122,255,.24),inset 0 1px 0 rgba(255,255,255,.32);}
  .brand-mark svg{width:24px;height:24px;}
  .brand-name{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .ctl-cluster{grid-area:ctl;display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .ctl-btn{height:42px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;
    font-size:14px;font-weight:620;white-space:nowrap;
    transition:background .2s,border-color .2s,transform .2s var(--ease),box-shadow .2s;}
  .ctl-btn:hover{background:#fff;border-color:var(--line2);transform:translateY(-1px);}
  .ctl-btn:active{transform:translateY(0) scale(.98);}
  .ctl-btn svg{width:15px;height:15px;}
  .play-btn{min-width:104px;color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:0 6px 18px rgba(16,18,22,.14);}
  .play-btn:hover{background:#2a2e34;border-color:#2a2e34;}
  .play-btn.paused{background:linear-gradient(145deg,#2b9bff,#0060df);border-color:transparent;box-shadow:0 7px 18px rgba(0,122,255,.24);}
  .play-btn.paused:hover{background:linear-gradient(145deg,#3aa4ff,#0a6ae8);}
  #replayBtn svg{transition:transform .5s var(--ease);}
  #replayBtn:hover svg{transform:rotate(-150deg);}
  #replayBtn.spin svg{transform:rotate(-360deg);}

  /* 4 段剧本切换胶囊：当前段蓝，已完成段轻绿，可点击跳转 */
  .steps{grid-area:steps;min-width:0;width:100%;max-width:760px;justify-self:center;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .step{appearance:none;min-width:0;height:44px;border:1px solid var(--line);border-radius:999px;
    background:rgba(255,255,255,.62);color:#5f666e;padding:0 14px;
    font-size:14px;font-weight:620;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease),transform .25s var(--ease);}
  .step:hover{background:#fff;border-color:var(--line2);color:#282e34;transform:translateY(-1px);}
  .step.active{color:var(--blue-deep);border-color:rgba(0,122,255,.32);background:linear-gradient(145deg,rgba(0,122,255,.13),rgba(50,173,230,.055));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(0,122,255,.09);}
  .step.done{color:#3e6d4b;border-color:rgba(52,199,89,.18);background:rgba(52,199,89,.055);}

  .workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(340px,.68fr);gap:20px;}
  .sim-panel,.device-panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:24px;
    background:rgba(255,255,255,.8);box-shadow:0 15px 50px rgba(32,39,46,.06),inset 0 1px 0 rgba(255,255,255,.85);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
  .sim-panel{padding:0;display:flex;flex-direction:column;border:0;background:transparent;box-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;animation:rise .8s var(--ease) .1s both;}

  /* ── 左侧：2.5D 智驾透视路面 ── */
  .road-stage{position:relative;flex:1 1 auto;min-height:320px;overflow:hidden;isolation:isolate;
    border:1px solid rgba(255,255,255,.55);border-radius:28px;background:#e6ecf2;
    box-shadow:0 24px 70px rgba(31,42,52,.11),0 2px 8px rgba(31,42,52,.04),inset 0 0 0 1px rgba(255,255,255,.35);}
  .road-stage::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -120px 160px -90px rgba(35,46,57,.16);}
  #roadCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .stage-hud{position:absolute;left:32px;right:32px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
    pointer-events:none;z-index:2;}
  .stage-hud.top{top:28px;}
  .stage-title{margin:0;color:#12171d;font-size:30px;line-height:1.06;font-weight:650;letter-spacing:-.045em;
    text-shadow:0 1px 0 rgba(255,255,255,.55);}
  .stage-title.flip{animation:flip .5s var(--ease);}
  @keyframes flip{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .stage-sub{margin:10px 0 0;color:rgba(20,29,37,.68);font-size:16px;line-height:1.35;font-weight:520;letter-spacing:-.012em;}
  .hud-chip{display:inline-flex;align-items:center;justify-content:center;height:40px;min-width:92px;padding:0 18px;
    border:1px solid rgba(255,255,255,.92);border-radius:999px;color:#141a20;background:rgba(255,255,255,.82);
    box-shadow:0 10px 28px rgba(35,46,57,.12),inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    font-size:16px;font-weight:700;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.005em;white-space:nowrap;
    transition:opacity .38s var(--ease),transform .38s var(--ease);}
  .hud-chip.hide{opacity:0;transform:translateY(-8px) scale(.96);}

  /* ── 右侧：真机 ── */
  .device-panel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.98),rgba(248,249,251,.78) 58%,rgba(238,240,244,.72)),rgba(255,255,255,.6);
    animation:rise .8s var(--ease) .16s both;}
  .device-panel::before{content:"";position:absolute;width:74%;aspect-ratio:1;left:13%;top:12%;border:1px solid rgba(33,42,49,.04);
    border-radius:50%;box-shadow:0 0 0 42px rgba(255,255,255,.12),0 0 0 84px rgba(255,255,255,.08);pointer-events:none;}
  .phone-shell{position:relative;z-index:1;width:min(352px,calc((100svh - 150px)*.4613 + 18px));max-width:100%;padding:9px;
    border:1px solid rgba(255,255,255,.6);border-radius:45px;flex:0 0 auto;
    background:linear-gradient(135deg,#9aa0a6 0%,#3a3f44 8%,#14171a 30%,#0a0c0e 68%,#43484d 92%,#82888e 100%);
    box-shadow:0 26px 58px rgba(29,36,42,.24),0 7px 16px rgba(29,36,42,.15),inset 0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 2px rgba(255,255,255,.1);}
  .phone-shell::after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.08);border-radius:41px;pointer-events:none;}
  .side-key{position:absolute;width:3px;border-radius:3px;background:linear-gradient(90deg,#24292d,#747a7f);box-shadow:inset 0 1px 1px rgba(255,255,255,.22);}
  .side-key.power{right:-4px;top:24%;height:12%;}
  .side-key.vol1{left:-4px;top:19%;height:8%;}
  .side-key.vol2{left:-4px;top:29%;height:8%;}
  .phone-screen{position:relative;width:100%;aspect-ratio:393/852;overflow:hidden;isolation:isolate;container-type:inline-size;
    border-radius:36px;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
  .phone-screen::after{content:"";position:absolute;inset:0;z-index:30;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);pointer-events:none;}

  /* 迷你地图：背景装饰层（羽化遮罩），不参与内容流 */
  .mini-map{position:absolute;z-index:0;top:0;right:0;width:44%;height:38%;overflow:hidden;background:#e8e8ed;pointer-events:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 13%,#000 42%),linear-gradient(180deg,#000 0% 78%,rgba(0,0,0,.5) 90%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 13%,#000 42%),linear-gradient(180deg,#000 0% 78%,rgba(0,0,0,.5) 90%,transparent 100%);
    -webkit-mask-composite:source-in;mask-composite:intersect;}
  .mini-map svg{width:100%;height:100%;}
  .m-bg{fill:#e8e8ed;}.m-park{stroke:#dce8dc;}.m-road{stroke:#c7c7cc;}.m-road2{stroke:#d8d8dc;}
  .m-route{stroke:#007aff;}.m-route-glow{stroke:rgba(0,122,255,.14);}
  .m-sign{fill:#fff;stroke:#ff3b30;}.m-sign-num{fill:#1a1c20;font-weight:700;}
  .m-cam{fill:#fff;stroke:#ff3b30;}.m-cam-dot{fill:#ff3b30;}
  .m-pos{fill:#007aff;stroke:#e8e8ed;}.m-pos-glow{fill:#007aff;opacity:.18;transform-box:fill-box;transform-origin:center;animation:posPulse 2.6s ease-in-out infinite;}
  @keyframes posPulse{0%,100%{transform:scale(1);opacity:.18;}50%{transform:scale(1.5);opacity:.07;}}

  .system-status{position:absolute;z-index:6;top:0;left:0;right:0;height:11.2cqw;padding:2.6cqw 6.1cqw 0;display:flex;align-items:center;
    color:#111;font-size:3.3cqw;font-weight:650;pointer-events:none;}
  .system-status .right{margin-left:auto;display:flex;align-items:center;gap:1.5cqw;}
  .system-status svg{width:4.2cqw;height:3.2cqw;}
  .system-status .bat{width:5.4cqw;height:2.7cqw;}
  .system-status .net{font-size:2.5cqw;font-weight:650;letter-spacing:-.02em;}
  .punch-hole{position:absolute;z-index:8;top:2.4cqw;left:50%;width:2.9cqw;height:2.9cqw;border-radius:50%;background:#08090a;
    transform:translateX(-50%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}

  /* ── 内容：垂直流式排版（flex column），绝不绝对定位压盖 ── */
  .app-flow{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;
    padding:13.74cqw 0 7.63cqw;}   /* topPad 54dp · bottomPad 30dp */
  .gauge-zone{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-wrap{position:relative;width:75.318cqw;height:75.318cqw;flex:0 0 auto;}   /* 296dp */
  .gauge-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .gauge-track{fill:none;stroke:var(--track);stroke-width:12;stroke-linecap:round;}
  .gauge-fill{fill:none;stroke:url(#phoneGrad);stroke-width:12;stroke-linecap:round;transition:stroke .25s ease;}
  .gauge-wrap.over .gauge-fill{stroke:var(--red);}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .speed-number{color:#000;font-size:27.48cqw;font-weight:300;line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums lining-nums;transition:color .25s ease;}
  .gauge-wrap.over .speed-number{color:var(--red);}
  .speed-unit{margin-top:3.05cqw;color:var(--dim);font-size:3.05cqw;line-height:1.2;font-weight:400;letter-spacing:.763cqw;text-indent:.763cqw;}
  .status-slot{height:6.87cqw;margin-top:4.58cqw;display:grid;place-items:center;}
  .status-badge{padding:1.527cqw 3.817cqw;border-radius:999px;color:var(--red);background:var(--red-soft);
    font-size:2.926cqw;line-height:1.25;font-weight:600;white-space:nowrap;opacity:0;transform:scale(.88);
    transition:opacity .3s ease,transform .3s var(--ease),background .25s,color .25s;}
  .status-badge.show{opacity:1;transform:scale(1);}
  .status-badge.severe{color:#fff;background:var(--red);}
  .gauge-wrap.severe .speed-number,.gauge-wrap.severe .gauge-fill,.status-badge.severe{animation:blink 1.6s linear infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
  .limit-sign{position:absolute;z-index:4;left:-1.527cqw;top:50%;width:18.321cqw;height:18.321cqw;display:grid;place-items:center;
    border:2.036cqw solid var(--red);border-radius:50%;color:#1a1c20;background:#fff;font-size:7.888cqw;line-height:1;font-weight:700;
    font-variant-numeric:tabular-nums;transform:translateY(-50%);transition:opacity .45s ease,transform .5s var(--ease);}
  .limit-sign.hide{opacity:0;transform:translateY(-50%) scale(.5);}

  /* 区间平均圆盘：独立流式插槽，展开时占据真实高度，与上下留足间距 */
  .avg-slot{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--ease),opacity .3s ease;}
  .avg-slot.show{grid-template-rows:1fr;opacity:1;}
  .avg-clip{min-height:0;overflow:hidden;display:flex;justify-content:center;}
  .avg-motion{padding-top:6.616cqw;}   /* avgGap 26dp */
  .avg-dial{position:relative;width:32.57cqw;height:32.57cqw;transform:scale(.85);transition:transform .5s var(--ease);}
  .avg-slot.show .avg-dial{transform:scale(1);}
  .avg-dial svg{width:100%;height:100%;overflow:visible;}
  .avg-track{fill:none;stroke:rgba(0,0,0,.08);stroke-width:8.54;}
  .avg-fill{fill:none;stroke:var(--blue);stroke-width:8.54;stroke-linecap:round;transition:stroke .25s ease;}
  .avg-dial.over .avg-fill{stroke:var(--red);}
  .avg-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .avg-number{color:#000;font-size:9.77cqw;line-height:1;font-weight:300;font-variant-numeric:tabular-nums;transition:color .25s;}
  .avg-dial.over .avg-number{color:var(--red);}
  .avg-label{margin-top:1.02cqw;color:var(--dim);font-size:2.54cqw;line-height:1.2;}
  .avg-dial.severe .avg-number,.avg-dial.severe .avg-fill{animation:blink 1.6s linear infinite;}

  /* 底部胶囊堆栈：两个互斥的独立插槽，依次流式排布 */
  .bottom-stack{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:0 4.58cqw;}
  .flow-slot{width:100%;display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(3.3cqw);
    transition:grid-template-rows .45s var(--ease),opacity .3s ease,transform .55s var(--ease);}
  .flow-slot.show{grid-template-rows:1fr;opacity:1;transform:translateY(0);}
  .flow-clip{min-height:0;overflow:hidden;display:flex;justify-content:center;}
  .cam-motion{padding-top:3.562cqw;}     /* 14dp */
  .light-motion{padding-top:3.053cqw;}   /* 12dp */
  .camera-capsule{display:inline-flex;align-items:center;gap:3.053cqw;padding:2.29cqw 5.089cqw 2.29cqw 2.545cqw;
    border:.255cqw solid rgba(0,0,0,.16);background:var(--surface);border-radius:999px;white-space:nowrap;}
  .mini-sign{width:10.178cqw;height:10.178cqw;display:grid;place-items:center;flex:0 0 auto;border:1.303cqw solid var(--red);
    border-radius:50%;color:#1a1c20;background:#fff;font-size:4.377cqw;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;}
  .camera-icon{width:5.598cqw;height:5.598cqw;flex:0 0 auto;color:var(--red);}
  .camera-copy{color:var(--muted);font-size:3.435cqw;line-height:1.25;font-variant-numeric:tabular-nums;}
  .camera-copy strong{color:#000;font-weight:700;}
  /* 单行直行绿灯胶囊：↑ + 3 灯珠 + 读秒（13dp 灯珠 / 18sp 读秒 / 6dp 间距） */
  .light-capsule{display:inline-flex;align-items:center;gap:1.527cqw;padding:2.545cqw 4.071cqw;
    border:.255cqw solid rgba(0,0,0,.16);background:var(--surface);border-radius:999px;white-space:nowrap;}
  .flow-glyph{width:3.562cqw;height:3.562cqw;margin-right:.51cqw;color:rgba(0,0,0,.66);flex:0 0 auto;}
  .light-dot{width:3.308cqw;height:3.308cqw;flex:0 0 auto;border-radius:50%;background:rgba(0,0,0,.12);transition:background .18s,opacity .18s;}
  .light-dot.red.on{background:var(--red);}
  .light-dot.yellow.on{background:var(--amber);}
  .light-dot.green.on{background:var(--green);}
  .light-dot.flash{animation:blink .96s linear infinite;}
  .light-count{min-width:4.6cqw;margin-left:1.018cqw;color:#000;font-size:4.58cqw;line-height:1;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
  .light-count.empty{min-width:0;margin:0;}
  .home-indicator{position:absolute;z-index:12;left:50%;bottom:2.03cqw;width:34cqw;height:1.27cqw;border-radius:999px;background:rgba(0,0,0,.78);transform:translateX(-50%);}

  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  @media (max-width:1240px){
    .topbar{gap:20px;}
    .steps{max-width:700px;}
  }
  @media (max-width:1120px){
    .page{padding-inline:18px;}
    .workspace{grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:15px;}
    .topbar{gap:16px;}
    .steps{max-width:620px;gap:7px;}
    .step{padding:0 10px;}
  }
  @media (max-width:900px){
    .page{height:auto;min-height:100svh;overflow:visible;padding:18px 16px 28px;}
    .topbar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand ctl" "steps steps";gap:14px 12px;}
    .steps{max-width:none;}
    .workspace{grid-template-columns:1fr;gap:18px;}
    .sim-panel{min-height:560px;}
    .device-panel{padding:26px 18px;}
    .phone-shell{width:min(352px,calc(100vw - 72px));}
  }
  @media (max-width:620px){
    .page{padding:14px 11px 22px;}
    .brand{gap:10px;}
    .brand-name{font-size:18px;}
    .brand-mark{width:38px;height:38px;border-radius:12px;}
    .brand-mark svg{width:22px;height:22px;}
    .ctl-cluster{gap:8px;}
    .ctl-btn{height:40px;padding:0 14px;font-size:13px;}
    .play-btn{min-width:88px;}
    .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
    .step{height:42px;font-size:14px;}
    .sim-panel{min-height:470px;}
    .road-stage{border-radius:24px;}
    .stage-hud{left:20px;right:20px;top:20px;}
    .stage-title{font-size:26px;}
    .stage-sub{font-size:15px;margin-top:8px;}
    .hud-chip{height:36px;min-width:80px;padding:0 14px;font-size:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    body::before{animation:none;}
  }
</style>

<body>

              <path class="m-route-glow" d="M305 820 L305 440 L290 280 L285 200 L300 60" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
              <path class="m-route" d="M305 820 L305 440 L290 280 L285 200 L300 60" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
              <g><circle class="m-sign" cx="305" cy="500" r="17" stroke-width="5"/><text class="m-sign-num" x="305" y="505" text-anchor="middle" font-size="14">60</text></g>
              <g><circle class="m-sign" cx="290" cy="280" r="17" stroke-width="5"/><text class="m-sign-num" x="290" y="285" text-anchor="middle" font-size="14">60</text></g>
              <rect class="m-cam" x="291" y="360" width="26" height="20" rx="4" stroke-width="1.5"/><circle class="m-cam-dot" cx="304" cy="370" r="4"/>
              <circle class="m-pos-glow" cx="305" cy="620" r="26"/>

          <!-- 系统状态栏 -->
          <div class="system-status" aria-hidden="true">
            <span class="tabular">9:41</span>
            <span class="right">
              <svg viewBox="0 0 18 12" fill="#111"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
              <span class="net">5G</span>
              <svg class="bat" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="#111" stroke-width="1.4" opacity=".5"/><rect x="3" y="3" width="15" height="7" rx="1.6" fill="#111"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="#111" opacity=".5"/></svg>

                      <circle class="avg-fill" id="avgFill" cx="64" cy="64" r="59.73" stroke-dasharray="0 375.3" transform="rotate(-90 64 64)"/>
                    </svg>

                  <svg class="camera-icon" id="camIconSpeed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10l5-2v8l-5-2z"/><circle cx="9.5" cy="12" r="2.4"/></svg>
                  <svg class="camera-icon" id="camIconInterval" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.6 1.6M9.5 3h5M12 3v2.5"/></svg>
                  <div class="camera-copy"><strong class="tabular" id="camDist">340m</strong><span id="camLabel"> 后 · 测速拍照</span></div>
                </div>
              </div></div></div>

              <div class="flow-slot" id="lightSlot"><div class="flow-clip"><div class="light-motion">
                <div class="light-capsule" id="lightCapsule">
                  <svg class="flow-glyph" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V2.5M7 2.5L4.2 5.6M7 2.5l2.8 3.1"/></svg>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  /* ════════════════════════════════════════════════════════════
     业务规则：逐行复刻现网 Compose 引擎
     ════════════════════════════════════════════════════════════ */
  var THRESHOLD_PCT = 10;
  var CAMERA_ALERT_RANGE_M = 800;
  var LIGHT_ALERT_RANGE_M = 300;

  // OverspeedDetector.classify
  function classify(speed, limit, cameraAhead, phase){
    if(limit == null) return "UNKNOWN";
    if(!cameraAhead) return "NORMAL";
    if(phase === "INSIDE") return speed > limit ? "OVER" : "NORMAL";   // 区间内瞬时只 OVER 不 SEVERE
    if(speed > limit * (1 + THRESHOLD_PCT / 100)) return "SEVERE";
    if(speed > limit) return "OVER";
    return "NORMAL";
  }
  // IntervalEngine.averageState
  function averageState(avg, limit){
    if(limit == null) return "NORMAL";
    if(avg > limit * (1 + THRESHOLD_PCT / 100)) return "SEVERE";
    if(avg > limit) return "OVER";
    return "NORMAL";
  }
  // DistanceFormat.format
  function fmtDist(m){
    m = Math.max(0, m);
    return m >= 1000 ? (m / 1000).toFixed(1) + "km" : Math.round(m) + "m";
  }
  // TrafficLightResolver.resolve（按周期推进相位）
  function resolveLight(phases, elapsedS){
    if(!phases || !phases.length) return null;
    var total = 0, i;
    for(i = 0; i < phases.length; i++){ if(phases[i].p <= 0) return null; total += phases[i].p; }
    var el = ((elapsedS % total) + total) % total;
    for(i = 0; i < phases.length; i++){
      var ph = phases[i];
      if(el < ph.p){ return { state: ph.s, seconds: Math.max(0, Math.ceil(ph.p - el)) }; }
      el -= ph.p;
    }
    return null;
  }

  /* ════════════════════════════════════════════════════════════
     剧本：单一世界时钟 → 速度曲线 → 里程表 → 绝对坐标设施
     默认演示时基 ×2.5；路口阶段单独切到 1:1 真实时间，
     让红绿灯读秒与车辆通过都按真实秒速发生。
     ════════════════════════════════════════════════════════════ */
  var TIME_SCALE = 2.5;
  var STAGE1_TIME_SCALE = 1;   // 路口阶段按真实物理时间推进，便于 1:1 读秒
  var LIGHT_REAL_OFFSET = 2;   // 阶段①开始时，绿灯相位已走过 2s（显示 16s）
  var LIMIT = 60;
  var LIGHT_LEAD = 150;    // 胶囊弹出时距停止线（≤300m 阈值）
  var CAM_LEAD   = 340;    // 胶囊弹出时距电子眼（≤800m 阈值）
  var INT_LEAD   = 90;     // 胶囊弹出时距区间起点（≤800m 阈值）
  var INT_LEN    = 260;    // 区间长度
  var MARK_LCM   = 30;     // 车道虚线 15m / 轮廓标 30m 的公倍数 → 循环接缝无跳变

  // 速度关键帧（世界秒, km/h），段间 smoothstep → 加减速无顿挫
  var SPEED_KEYS = [
    [0,52],[19,52],
    [23,64],[28,64],      // 超速 10% 以内
    [32,70],[38.5,70],    // 超速 >10%
    [42.5,52],[47,52],
    [49.5,56],[63,56],[66,52],
    [120,52]
  ];
  function smooth(u){ return u*u*(3-2*u); }
  function speedAt(t){
    if(t <= SPEED_KEYS[0][0]) return SPEED_KEYS[0][1];
    for(var i=1;i<SPEED_KEYS.length;i++){
      if(t <= SPEED_KEYS[i][0]){
        var a=SPEED_KEYS[i-1], b=SPEED_KEYS[i];
        var u=(t-a[0])/(b[0]-a[0]);
        return a[1]+(b[1]-a[1])*smooth(u);
      }
    }
    return SPEED_KEYS[SPEED_KEYS.length-1][1];
  }

  // 预积分里程表：carMeters 与 speed 严格同源，无累积漂移
  var STEP = 1/120, T_MAX = 120, DIST = [0];
  (function(){
    var acc = 0;
    for(var t=0; t<T_MAX; t+=STEP){
      acc += speedAt(t+STEP/2)/3.6*STEP;
      DIST.push(acc);
    }
  })();
  function distAt(t){
    if(t<=0) return 0;
    var x = t/STEP, i = Math.floor(x);
    if(i >= DIST.length-1) return DIST[DIST.length-1] + speedAt(t)/3.6*(t-T_MAX);
    return DIST[i] + (DIST[i+1]-DIST[i])*(x-i);
  }
  function timeAtDist(m){
    if(m<=0) return 0;
    var lo=0, hi=DIST.length-1;
    if(m >= DIST[hi]) return T_MAX + (m-DIST[hi])/(52/3.6);
    while(hi-lo > 1){ var mid=(lo+hi)>>1; if(DIST[mid] <= m) lo=mid; else hi=mid; }
    var span = DIST[hi]-DIST[lo];
    return (lo + (span>0 ? (m-DIST[lo])/span : 0))*STEP;
  }

  var S = {};
  (function buildScript(){
    S.cruiseEnd = 8;
    S.stopPos   = distAt(S.cruiseEnd) + LIGHT_LEAD;
    S.passStop  = timeAtDist(S.stopPos);
    S.camShow   = S.passStop + 2.1;                       // 路口驶离，进入阶段③
    S.camPos    = distAt(S.camShow) + CAM_LEAD;
    S.passCam   = timeAtDist(S.camPos);
    S.intShow   = S.passCam + 6.4;                        // 车速回落完成，进入阶段④
    S.intStart  = distAt(S.intShow) + INT_LEAD;
    S.intEnter  = timeAtDist(S.intStart);
    S.intEnd    = S.intStart + INT_LEN;
    S.intExit   = timeAtDist(S.intEnd);
    S.loopM     = Math.ceil(distAt(S.intExit + 0.6)/MARK_LCM)*MARK_LCM;
    S.loopT     = timeAtDist(S.loopM);
    // 阶段边界（米）——与胶囊弹出点严格重合
    S.bound = [0, S.stopPos-LIGHT_LEAD, S.camPos-CAM_LEAD, S.intStart-INT_LEAD, S.loopM];
    S.stage1T = timeAtDist(S.bound[1]);
    S.entities = [
      {type:"sign",pos:100,limit:LIMIT},
      {type:"intersection",pos:S.stopPos},
      {type:"sign",pos:430,limit:LIMIT},
      {type:"gantry",pos:S.camPos,kind:"speed",limit:LIMIT},
      {type:"sign",pos:720,limit:LIMIT},
      {type:"gantry",pos:S.intStart,kind:"interval-start",limit:LIMIT},
      {type:"sign",pos:980,limit:LIMIT},
      {type:"gantry",pos:S.intEnd,kind:"interval-end",limit:LIMIT}
    ];
    // 直行相位按真实秒计：阶段①开始时绿灯剩 16s，通过停止线仍为绿灯
    S.phases = [{s:"GREEN",p:18},{s:"YELLOW",p:3},{s:"RED",p:26}];
  })();

  function stageForMeters(m){
    return m < S.bound[1] ? 0 : m < S.bound[2] ? 1 : m < S.bound[3] ? 2 : 3;
  }
  function lightPhaseAt(){
    // 红绿灯独立于演示时基：阶段①内严格按真实秒推进
    return resolveLight(S.phases, sim.lightReal);
  }


  /* ════════════════════════════════════════════════════════════
     单一 simState —— 左右两侧 100% 由此实时计算
     ════════════════════════════════════════════════════════════ */
  var sim = {
    running:true, t:0, carMeters:0, speed:52, limit:LIMIT,
    stage:0, introFade:0, loops:0,
    cameraAhead:false, phase:"NONE", over:"NORMAL", avgState:"NORMAL",
    camVisible:false, camKind:"speed", camDist:0, camLabel:"", camSign:LIMIT,
    avgVisible:false, avg:0,
    lightVisible:false, lightState:"GREEN", lightSeconds:16,
    lightReal:LIGHT_REAL_OFFSET,
    brake:false, ambient:[],
    beat:"", beatTone:""
  };

  function spawnAmbient(){
    sim.ambient = [
      { pos: sim.carMeters + 150 + Math.random()*90, lane:-0.62, speed: 40 + Math.random()*12, hue:0 },
      { pos: sim.carMeters + 330 + Math.random()*140, lane: 0.62, speed: 46 + Math.random()*14, hue:1 }
    ];
  }

  /* ── 由 simState 推导所有 UI 状态（每帧） ── */
  function derive(){
    var car = sim.carMeters, t = sim.t;
    var prevStage = sim.stage;
    var stage = stageForMeters(car);
    if(stage === 1 && prevStage !== 1) sim.lightReal = LIGHT_REAL_OFFSET;
    sim.stage = stage;

    // 剧本同一时刻只上报一处设施 → 底部胶囊天然互斥，零重叠
    var camVisible=false, camKind="speed", camDist=0, camLabel="", cameraAhead=false;
    var lightVisible=false, lightState="GREEN", lightSeconds=0;
    var phase="NONE", inside=false, approaching=false, avgVisible=false, avg=0;

    if(stage === 1){
      var dStop = S.stopPos - car;
      if(dStop > 0 && dStop <= LIGHT_ALERT_RANGE_M){
        var r = lightPhaseAt();
        if(r && r.state !== "OFF" && r.state !== "UNKNOWN"){
          lightVisible = true; lightState = r.state; lightSeconds = r.seconds;
        }
      }
    } else if(stage === 2){
      var dCam = S.camPos - car;
      if(dCam > 0 && dCam <= CAMERA_ALERT_RANGE_M){
        cameraAhead = true; camVisible = true; camKind = "speed";
        camDist = dCam; camLabel = "测速拍照";
      }
    } else if(stage === 3){
      var dStart = S.intStart - car, dEnd = S.intEnd - car;
      if(car >= S.intStart && car < S.intEnd){
        inside = true; phase = "INSIDE";
        cameraAhead = true; camVisible = true; camKind = "interval";
        camDist = dEnd; camLabel = "区间测速结束";
        var elapsed = t - S.intEnter;
        if(elapsed > 0.12){ avg = (car - S.intStart)/elapsed*3.6; avgVisible = true; }
      } else if(car < S.intStart && dStart <= CAMERA_ALERT_RANGE_M){
        approaching = true; phase = "APPROACH";
        cameraAhead = true; camVisible = true; camKind = "interval";
        camDist = dStart; camLabel = "进入区间测速";
      }
    }

    sim.phase = phase;
    sim.cameraAhead = cameraAhead;
    sim.camVisible = camVisible; sim.camKind = camKind; sim.camDist = camDist;
    sim.camLabel = camLabel; sim.camSign = LIMIT;
    sim.lightVisible = lightVisible; sim.lightState = lightState; sim.lightSeconds = lightSeconds;
    sim.over = classify(sim.speed, sim.limit, cameraAhead, phase);
    sim.avgVisible = avgVisible; sim.avg = avg;
    sim.avgState = averageState(avg, LIMIT);
    sim.brake = speedAt(t + 0.18) < sim.speed - 0.35;

    // 左侧剧本旁白
    var beat="", tone="";
    if(stage === 0){ beat = "巡航稳定 · 限速内行驶"; }
    else if(stage === 1){
      if(lightVisible){ beat = "直行绿灯 " + lightSeconds + "s · 不停车通过"; tone="ok"; }
      else { beat = "已驶过停止线 · 路口清空"; tone="ok"; }
    } else if(stage === 2){
      if(sim.over === "SEVERE"){ beat = "超速 >10% · 严重超速闪烁"; tone="severe"; }
      else if(sim.over === "OVER"){ beat = "超速 10% 以内 · 仪表变红"; tone="warn"; }
      else if(camVisible){ beat = "接近测速电子眼 · 车速正常"; }
      else { beat = "已驶过电子眼 · 车速回落"; tone="ok"; }
    } else {
      if(inside){ beat = "区间平均 " + Math.round(avg) + " km/h · 低于限速"; tone="ok"; }
      else if(approaching){ beat = "前方区间测速起点"; }

  // 路面直行导向箭头
  function drawLaneArrow(dTail){

    ctx.moveTo(xh,ph.y); ctx.lineTo(xt+wh,pt.y); ctx.lineTo(xt-wh,pt.y); ctx.closePath(); ctx.fill();
  }

  function drawIntersection(e){
    var d=e.pos-sim.carMeters; if(d<=-26||d>EVIEW) return;
    var dd=Math.max(d,0.5);
    var p=proj(dd), h=p.half;
    var a = d>0 ? entAlpha(dd) : Math.max(0,1+d/26);
    if(a<=0) return;
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,a));

    // 横向路口：柔和的沥青带，不用硬边线
    var ch=h*0.52, cy=p.y-ch*0.30;
    var cg=ctx.createLinearGradient(0,cy,0,cy+ch);
    cg.addColorStop(0,"rgba(210,218,226,.0)");
    cg.addColorStop(0.16,"rgba(214,222,229,.88)");
    cg.addColorStop(0.7,"rgba(224,230,236,.94)");
    cg.addColorStop(1,"rgba(230,235,240,.0)");
    ctx.fillStyle=cg; ctx.fillRect(0,cy,W,ch);

    if(d>0){
      // 斑马线
      var pz=proj(d+3.2), zw=pz.half*0.050;

      for(var z=-4;z<=4;z++){
        var zx=latX(pz,z*0.208);
        roundRect(zx-zw/2,pz.y-Math.max(0.6,pz.half*0.015),zw,Math.max(1.2,pz.half*0.032),zw*0.18);
        ctx.fill();
      }

      // 停止线
      var ps=proj(d-2), sw=Math.max(0.75,ps.half*0.034);
      ctx.fillStyle="rgba(255,255,255,.93)";
      ctx.beginPath();
      ctx.moveTo(latX(ps,-1),ps.y-sw); ctx.lineTo(latX(ps,1),ps.y-sw);
      ctx.lineTo(latX(ps,1),ps.y+sw); ctx.lineTo(latX(ps,-1),ps.y+sw); ctx.closePath(); ctx.fill();

      drawLaneArrow(d-16);

      // 路口龙门架
      var poleTop=p.y-h*0.94, colW=Math.max(1,h*0.045);
      [latX(p,-1.16),latX(p,1.16)].forEach(function(x){
        ctx.beginPath(); ctx.ellipse(x,p.y,colW*1.45,colW*0.4,0,0,Math.PI*2);
        ctx.fillStyle="rgba(36,47,58,.11)"; ctx.fill();

        var cg2=ctx.createLinearGradient(x-colW/2,0,x+colW/2,0);
        cg2.addColorStop(0,"#737f8b"); cg2.addColorStop(0.42,"#c2ccd5"); cg2.addColorStop(1,"#68747f");
        ctx.fillStyle=cg2; ctx.fill();

      var bx=latX(p,-1.18), bw=latX(p,1.18)-bx, barH=Math.max(2,h*0.064);

      bg.addColorStop(0,"#c9d2da"); bg.addColorStop(1,"#7c8792");
      ctx.fillStyle=bg; ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.48)";
      roundRect(bx+barH*0.16,poleTop-barH+barH*0.13,bw-barH*0.32,barH*0.16,barH*0.08); ctx.fill();

      // 直行灯头（与手机胶囊同一 resolve 结果）

      var hx=latX(p,0), hw=h*0.105, hh=h*0.27, hy=poleTop+h*0.040;
      ctx.fillStyle="#8d959e"; ctx.fillRect(hx-h*0.008,poleTop,h*0.016,hy-poleTop);

      ctx.fillStyle=hg; ctx.fill();
      ctx.lineWidth=Math.max(0.4,h*0.003); ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.stroke();

      var lamps=[["RED","#ff3b30"],["YELLOW","#ff9500"],["GREEN","#34c759"]];
      for(var k=0;k<3;k++){

    ctx.strokeStyle="rgba(255,255,255,.62)"; ctx.lineWidth=Math.max(0.5,w*0.003); ctx.stroke();

    // 深色后窗：规整梯形，留出清晰车顶与 C 柱
    traceCarGlass(x,y,w,h);
    var gg=ctx.createLinearGradient(0,y-h*0.93,0,y-h*0.65);
    gg.addColorStop(0,"#46535f"); gg.addColorStop(0.24,"#2a343d"); gg.addColorStop(0.68,"#1b242c"); gg.addColorStop(1,"#303b45");
    ctx.fillStyle=gg; ctx.fill();
    ctx.strokeStyle="rgba(212,220,228,.55)"; ctx.lineWidth=Math.max(0.5,w*0.0028); ctx.stroke();

    // 天幕：车顶中央深色玻璃，四周保留车漆边框
    traceRoofPanel(x,y,w,h);
    var rg=ctx.createLinearGradient(0,y-h*0.99,0,y-h*0.94);
    rg.addColorStop(0,"#4b5965"); rg.addColorStop(0.35,"#2c3740"); rg.addColorStop(1,"#1c242b");
    ctx.fillStyle=rg; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=Math.max(0.4,w*0.0022); ctx.stroke();

    ctx.save(); traceCarGlass(x,y,w,h); ctx.clip();
    ctx.beginPath();
    ctx.moveTo(x-w*0.280,y-h*0.795); ctx.lineTo(x-w*0.020,y-h*0.930);
    ctx.lineTo(x+w*0.075,y-h*0.930); ctx.lineTo(x-w*0.215,y-h*0.755); ctx.closePath();
    var refl=ctx.createLinearGradient(x-w*0.280,y-h*0.80,x+w*0.020,y-h*0.92);
    refl.addColorStop(0,"rgba(255,255,255,0)"); refl.addColorStop(0.46,"rgba(255,255,255,.13)"); refl.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=refl; ctx.fill();
    ctx.restore();

    // 小巧后视镜
    drawMirror(x,y,w,h,-1,bodyB,bodyC);
    drawMirror(x,y,w,h,1,bodyB,bodyC);

    // 深色后保 / 扩散器 / 反光片
    var dw=w*0.500, dh=h*0.055, dx=x-dw/2, dy=y-h*0.108;
    roundRect(dx,dy,dw,dh,dh*0.28);
    var dg=ctx.createLinearGradient(0,dy,0,dy+dh);
    dg.addColorStop(0,"#333c45"); dg.addColorStop(1,"#171d23");
    ctx.fillStyle=dg; ctx.fill();
    for(var fi=0;fi<4;fi++){
      var fx=dx+dw*(0.18+fi*0.215);
      ctx.fillStyle="rgba(255,255,255,.07)";
      ctx.fillRect(fx,dy+dh*0.25,Math.max(0.5,w*0.0035),dh*0.55);
    }
    roundRect(x-w*0.360,y-h*0.073,w*0.720,h*0.012,h*0.006);
    ctx.fillStyle="rgba(38,46,55,.62)"; ctx.fill();
    [-1,1].forEach(function(s){
      roundRect(x+s*w*0.320-w*0.035,y-h*0.165,w*0.070,h*0.040,h*0.014);
      ctx.fillStyle="rgba(40,48,57,.42)"; ctx.fill();
      ctx.lineWidth=Math.max(0.4,w*0.0025); ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.stroke();
      roundRect(x+s*w*0.335-w*0.021,y-h*0.205,w*0.042,h*0.012,h*0.005);
      ctx.fillStyle="rgba(214,72,64,.38)"; ctx.fill();
    });

    // 干净平直的贯穿式 LED 尾灯
    var ly=y-h*0.515, lh=h*0.028, lw=w*0.780;
    ctx.save();
    roundRect(x-lw*0.515,ly-lh*0.55,lw*1.03,lh*2.1,lh*0.5);
    var lhbg=ctx.createLinearGradient(0,ly-lh*0.55,0,ly+lh*1.55);
    lhbg.addColorStop(0,"rgba(80,32,31,.16)"); lhbg.addColorStop(1,"rgba(52,20,20,.08)");
    ctx.fillStyle=lhbg; ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowColor=hot?"rgba(255,55,45,.95)":"rgba(226,64,56,.32)";
    ctx.shadowBlur=hot?w*0.14:w*0.045;
    roundRect(x-lw/2,ly,lw,lh,lh*0.48);
    var tlg=ctx.createLinearGradient(0,ly,0,ly+lh);
    if(hot){ tlg.addColorStop(0,"#ffe0db"); tlg.addColorStop(0.24,"#ff6257"); tlg.addColorStop(1,"#c91e18"); }
    else { tlg.addColorStop(0,"#e7a09a"); tlg.addColorStop(0.42,"#c74d48"); tlg.addColorStop(1,"#8c2522"); }
    ctx.fillStyle=tlg; ctx.fill();
    ctx.restore();
    ctx.strokeStyle=hot?"rgba(255,246,243,.92)":"rgba(255,224,220,.44)";
    ctx.lineWidth=Math.max(0.5,h*0.004);
    ctx.beginPath(); ctx.moveTo(x-lw*0.40,ly+lh*0.46); ctx.lineTo(x+lw*0.40,ly+lh*0.46); ctx.stroke();

    // 高位刹车灯
    ctx.save();
    if(hot){ ctx.shadowColor="rgba(255,59,48,.85)"; ctx.shadowBlur=w*0.07; }
    ctx.fillStyle=hot?"rgba(255,72,62,.95)":"rgba(150,54,50,.28)";
    roundRect(x-w*0.060,y-h*0.936,w*0.120,h*0.010,h*0.005); ctx.fill();
    ctx.restore();

    if(ego){
      // 极轻的尾部铭牌，不做多余文字
      ctx.fillStyle="rgba(48,58,68,.26)";
      roundRect(x-w*0.040,y-h*0.365,w*0.080,h*0.010,h*0.005); ctx.fill();
    }
    ctx.restore();
  }

  function drawAmbient(){
    for(var i=0;i<sim.ambient.length;i++){
      var a=sim.ambient[i], d=a.pos-sim.carMeters;
      if(d<=3||d>EVIEW) continue;
      var al=entAlpha(d); if(al<=0) continue;
      var p=proj(d), w=p.half*0.34, h=w*0.70;
      ctx.save(); ctx.globalAlpha=al;
      var bodyA=a.hue?"#f3f7fa":"#fbfdfe", bodyB=a.hue?"#e3e9ef":"#edf1f4",
          bodyC=a.hue?"#c0cad4":"#cbd3db", bodyD=a.hue?"#a6b2be":"#adb7c2";
      drawCarModel(latX(p,a.lane),p.y,w,h,{bodyA:bodyA,bodyB:bodyB,bodyC:bodyC,bodyD:bodyD});
      ctx.restore();
    }
  }

  function drawEgo(){
    var w=Math.min(W*0.215,H*0.31), h=w*0.72;
    var hot=sim.brake || sim.over==="OVER" || sim.over==="SEVERE";
    drawCarModel(cx,H*0.940,w,h,{ego:true,brake:hot});
  }

  function drawHaze(){
    var g=ctx.createLinearGradient(0,horizonY-H*0.05,0,horizonY+H*0.18);
    g.addColorStop(0,"rgba(238,243,247,.92)");
    g.addColorStop(0.42,"rgba(238,243,247,.30)");
    g.addColorStop(1,"rgba(238,243,247,0)");
    ctx.fillStyle=g; ctx.fillRect(0,horizonY-H*0.05,W,H*0.24);
  }

  function renderRoad(){
    if(W<=0) return;
    ctx.clearRect(0,0,W,H);
    drawSky();
    drawRoad();
    var list=S.entities.slice().sort(function(a,b){ return b.pos-a.pos; });
    for(var j=0;j<list.length;j++){
      var e=list[j];
      if(e.type==="sign") drawSign(e);
      else if(e.type==="gantry") drawGantry(e);
      else if(e.type==="intersection") drawIntersection(e);
    }
    drawAmbient();
    drawHaze();
    drawEgo();
  }

  /* ════════════════════════════════════════════════════════════
     主循环：单一 rAF 驱动仿真 + 两侧渲染
     ════════════════════════════════════════════════════════════ */
  var last=performance.now();
  function loop(now){
    var rawDt=(now-last)/1000; last=now;
    var dt=Math.min(0.05,rawDt);
    advance(dt, rawDt);
    derive();
    renderPhone();
    renderHUD();
    renderRoad();
    requestAnimationFrame(loop);
  }

  /* ════════════════════════════════════════════════════════════
     控件：只有 播放/暂停 与 重播
     ════════════════════════════════════════════════════════════ */
  var playBtn=$("playBtn"), playLabel=$("playLabel"), playIcon=$("playIcon"), replayBtn=$("replayBtn");
  var ICON_PAUSE='<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>';
  var ICON_PLAY='<path d="M8 5.5v13l11-6.5z"/>';
  function syncPlay(){
    playLabel.textContent = sim.running ? "暂停" : "开始";
    playIcon.innerHTML = sim.running ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute("aria-pressed", sim.running ? "true" : "false");
    playBtn.classList.toggle("paused", !sim.running);
  }
  function togglePlay(){ sim.running = !sim.running; syncPlay(); }
  playBtn.addEventListener("click", togglePlay);
  replayBtn.addEventListener("click", function(){
    replay();
    sim.running = true; syncPlay();
    replayBtn.classList.add("spin");
    setTimeout(function(){ replayBtn.classList.remove("spin"); }, 520);
  });
  window.addEventListener("keydown", function(e){
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(e.code === "Space"){ e.preventDefault(); togglePlay(); }
    else if(e.key === "r" || e.key === "R"){ e.preventDefault(); replayBtn.click(); }
  });

  /* ── 启动 ── */
  resize();
  syncPlay();
  spawnAmbient();
  derive(); renderPhone(); renderHUD(); renderRoad();
  requestAnimationFrame(loop);

  // 交付自检钩子：seek 可确定性跳转到任意世界时刻
  window.__velora = {
    sim:sim, script:S, TIME_SCALE:TIME_SCALE,
    STAGE1_TIME_SCALE:STAGE1_TIME_SCALE, LIGHT_REAL_OFFSET:LIGHT_REAL_OFFSET,
    speedAt:speedAt, distAt:distAt, timeAtDist:timeAtDist,
    classify:classify, resolveLight:resolveLight, lightPhaseAt:lightPhaseAt, stageForMeters:stageForMeters,
    derive:derive, advance:advance, renderPhone:renderPhone, renderHUD:renderHUD, renderRoad:renderRoad,
    replay:replay, togglePlay:togglePlay,
    seek:function(t){
      sim.t = Math.max(0, Math.min(S.loopT-1e-6, t));
      sim.carMeters = distAt(sim.t); sim.speed = speedAt(sim.t); sim.introFade = 1;
      sim.stage = stageForMeters(sim.carMeters);
      sim.lightReal = LIGHT_REAL_OFFSET + Math.max(0, (sim.t - S.stage1T) / STAGE1_TIME_SCALE);
      spawnAmbient(); derive(); renderPhone(); renderHUD(); renderRoad();
      return { t:sim.t, car:sim.carMeters, speed:sim.speed, stage:sim.stage, over:sim.over,
               lightVisible:sim.lightVisible, lightState:sim.lightState, lightSeconds:sim.lightSeconds, lightReal:sim.lightReal,
               camVisible:sim.camVisible, camDist:sim.camDist, avgVisible:sim.avgVisible, avg:sim.avg };
    },
    sync:function(){ derive(); renderPhone(); renderHUD(); renderRoad(); }
  };
})();
</script>
</body>
</html>
